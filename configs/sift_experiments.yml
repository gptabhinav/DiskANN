global:
  data_dir: data/sift
  index_dir: build/index/sift
  data_type: float
  dist_fn: l2
  max_degree: 32
  Lbuild: 50
  alpha: 1.2

fvecs_to_bin:
  exe: ./build/apps/utils/fvecs_to_bin
  args: [data_type, input_file, output_file]
  input_file: ${data_dir}/sift_learn.fvecs
  output_file: ${data_dir}/bins/sift_learn.fbin

compute_groundtruth:
  exe: ./build/apps/utils/compute_groundtruth
  args: [base_file, query_file, gt_file, K, data_type, dist_fn]
  base_file: ${data_dir}/bins/sift_learn.fbin
  query_file: ${data_dir}/bins/sift_query.fbin
  gt_file: ${data_dir}/bins/sift_query_learn_gt100
  K: 10

build_memory_index:
  exe: ./build/apps/build_memory_index
  args: [data_path, index_path_prefix, max_degree, Lbuild, alpha, dist_fn, data_type]
  data_path: ${data_dir}/bins/sift_learn.fbin
  index_path_prefix: ${index_dir}/index_sift_learn_R${max_degree}_L${Lbuild}_A${alpha}

search_memory_index:
  exe: ./build/apps/search_memory_index
  args: [data_type, dist_fn, index_path_prefix, result_path, query_file, recall_at, search_list, gt_file]
  index_path_prefix: ${index_dir}/index_sift_learn_R${max_degree}_L${Lbuild}_A${alpha}
  query_file: ${data_dir}/bins/sift_query.fbin
  gt_file: ${data_dir}/bins/sift_query_learn_gt100
  recall_at: 10
  search_list: 10 20 30 40 50 100
  result_path: ${data_dir}/result/index_sift_learn_R${max_degree}_L${Lbuild}_A${alpha}_res